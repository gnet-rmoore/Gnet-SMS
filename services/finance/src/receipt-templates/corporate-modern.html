<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Money Receipt — Corporate Modern</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --slate:#1c2733;
    --slate-2:#28374a;
    --steel:#3f6b8a;
    --brass:#b58a4a;
    --paper:#f8f9fb;
    --line:#dde2ea;
    --ink:#1c2733;
    --muted:#7c8798;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:48px 16px;
    background:#e6e9ee;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;justify-content:center;
  }
  .sheet{width:100%;max-width:880px;}
  .toolbar{display:flex;justify-content:flex-end;margin-bottom:18px;}
  .toolbar button{
    font-family:'Sora',sans-serif;font-weight:600;font-size:12px;
    letter-spacing:0.05em;text-transform:uppercase;
    background:var(--slate);color:#fff;border:none;padding:10px 20px;cursor:pointer;
  }
  .toolbar button:hover{background:var(--steel);}
  .receipt{
    background:var(--paper);
    box-shadow:0 30px 60px -22px rgba(28,39,51,0.35);
    border-top:5px solid var(--brass);
  }
  .header{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:36px 44px 24px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:42px;height:42px;background:var(--slate);
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:var(--brass);
  }
  .brand-name{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:var(--slate);}
  .brand-name .sub{
    display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:10px;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-top:3px;
  }
  .title{text-align:right;}
  .title .eyebrow{
    font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:var(--brass);font-weight:600;
  }
  .title h1{
    font-family:'Sora',sans-serif;font-weight:700;font-size:24px;margin:4px 0 0;color:var(--slate);
  }
  .id-row{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    border-bottom:1px solid var(--line);
  }
  .id-cell{
    padding:16px 44px;
    border-right:1px solid var(--line);
  }
  .id-cell:last-child{border-right:none;}
  .id-cell label{
    display:block;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin-bottom:6px;
  }
  .id-cell input{
    border:none;background:transparent;font-family:'IBM Plex Mono',monospace;
    font-size:13px;color:var(--slate);width:100%;
  }
  .id-cell input:focus{outline:none;}
  .body-grid{padding:30px 44px 6px;}
  .row{display:flex;align-items:baseline;gap:16px;margin-bottom:22px;}
  .row label{
    font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--muted);width:180px;flex-shrink:0;
  }
  .row input{
    flex:1;border:none;background:transparent;border-bottom:1px solid var(--line);
    font-size:15px;padding:2px 4px 8px;color:var(--ink);font-family:'Inter',sans-serif;
  }
  .row .val,.meta-row .val,.id-cell .val,.pay-row .val,.words-row .val,.memo .val,.amount-strip .val,.amount-box .val,.amount-line .val,.num-block .val,.row-date .val{font:inherit;color:inherit;flex:1;border-bottom:1px solid var(--line, #dde2e6);padding:2px 4px 6px;}
  .signature-slot .line{border-bottom:1px solid var(--ink,#1a1a1a);min-height:42px;display:flex;align-items:flex-end;justify-content:center;}
  .amount-words{font-style:italic;min-height:1.2em;}
  .row input:focus{outline:none;border-bottom-color:var(--steel);}
  .two-col{display:flex;gap:30px;}
  .two-col > .row{flex:1;}
  .table{
    margin:8px 44px 0;
    border:1px solid var(--line);
  }
  .table-head{
    display:grid;grid-template-columns:1fr 140px 140px;
    background:var(--slate);color:#fff;
    font-family:'Sora',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;
  }
  .table-head div{padding:11px 16px;}
  .table-row{
    display:grid;grid-template-columns:1fr 140px 140px;
    border-top:1px solid var(--line);
  }
  .table-row input{
    border:none;background:transparent;padding:12px 16px;font-size:13px;color:var(--ink);width:100%;font-family:'Inter',sans-serif;
  }
  .table-row input:focus{outline:none;background:#eef1f6;}
  .table-row div:not(:last-child) input, .table-row div{border-right:1px solid var(--line);}
  .amount-strip{
    margin:26px 44px 0;
    display:flex;justify-content:flex-end;
  }
  .amount-box{
    background:var(--slate);color:#fff;
    display:flex;align-items:center;gap:16px;
    padding:16px 26px;
    min-width:280px;
    justify-content:space-between;
  }
  .amount-box label{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass);font-weight:600;}
  .amount-box .value{display:flex;align-items:baseline;gap:4px;}
  .amount-box .value .cur{font-size:15px;color:var(--brass);}
  .amount-box input{
    background:transparent;border:none;color:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:22px;width:130px;
  }
  .amount-box input:focus{outline:none;}
  .sign-row{display:flex;justify-content:space-between;padding:44px 44px 34px;gap:40px;}
  .sign-block{flex:1;text-align:center;}
  .sign-block .line{border-bottom:1px solid var(--ink);height:42px;}
  .sign-block label{display:block;margin-top:8px;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
  .footer-line{height:4px;background:linear-gradient(90deg,var(--slate),var(--steel),var(--brass));}
  @media print{
    body{background:#fff;padding:0;}
    .toolbar{display:none;}
    .receipt{box-shadow:none;}
  }
  @media (max-width:600px){
    .header{flex-direction:column;gap:18px;padding:24px;}
    .title{text-align:left;}
    .id-row{grid-template-columns:1fr;}
    .id-cell{border-right:none;border-bottom:1px solid var(--line);padding:14px 24px;}
    .body-grid{padding:22px 24px 6px;}
    .two-col{flex-direction:column;gap:0;}
    .row label{width:140px;font-size:10px;}
    .table{margin:8px 24px 0;}
    .table-head, .table-row{grid-template-columns:1fr 90px 90px;}
    .amount-strip{margin:22px 24px 0;justify-content:stretch;}
    .amount-box{width:100%;min-width:0;}
    .sign-row{flex-direction:column;gap:22px;padding:32px 24px;}
  }
</style>
</head>
<body>
<div class="sheet">
<div class="receipt">
    <div class="header">
      <div class="brand">
        <div class="brand-mark">{{SCHOOL_INITIAL}}</div>
        <div class="brand-name">{{SCHOOL_NAME}}<span class="sub">{{DOC_KICKER}}</span></div>
      </div>
      <div class="title">
        <div class="eyebrow">Official Document</div>
        <h1>{{DOC_TITLE}}</h1>
      </div>
    </div>
    <div class="id-row">
      <div class="id-cell"><label>Receipt No.</label><span class="val">{{RECEIPT_NUMBER}}</span></div>
      <div class="id-cell"><label>Date Issued</label><span class="val">{{ISSUED_DATE}}</span></div>
      <div class="id-cell"><label>Contact No.</label><span class="val"></span></div>
    </div>
    <div class="body-grid">
      <div class="row"><label>Received with thanks from</label><span class="val">{{PAYER_NAME}}</span></div>
      <div class="two-col">
        <div class="row"><label>By cash / cheque</label><span class="val">—</span></div>
        <div class="row"><label>Bank</label><span class="val">{{SOURCE_REF}}</span></div>
      </div>
      <div class="row"><label>Amount in words</label><span class="val amount-words">{{AMOUNT_WORDS}}</span></div>
    </div>
    <div class="table">{{CORPORATE_LINE_ITEMS_HTML}}</div>
    <div class="amount-strip">
      <div class="amount-box">
        <label>Total Amount</label>
        <div class="value"><span class="cur">$</span><span class="val">{{TOTAL_FORMATTED}}</span></div>
      </div>
    </div>
    <div class="sign-row">
      <div class="sign-block"><div class="line"></div><label>Received By</label></div>
      <div class="sign-block signature-slot">{{SIGNATURE_HTML}}<label>{{SIGNER_TITLE}}</label></div>
    </div>
    <div class="footer-line"></div>
  </div>
</div>
  {{VERIFY_FOOTER_HTML}}
  {{VOIDED_HTML}}
</body>
</html>
