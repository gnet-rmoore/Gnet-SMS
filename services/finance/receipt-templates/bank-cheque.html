<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Cheque</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Cutive+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0d5f5e;
    --teal-deep:#08403f;
    --plum:#6a4c93;
    --ink:#1c2a29;
    --muted:#5a6a68;
    --paper:#eef7f5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:48px 16px;
    background:#dfe7e2;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;justify-content:center;
  }
  .sheet{width:100%;max-width:920px;}
  .toolbar{display:flex;justify-content:flex-end;margin-bottom:18px;}
  .toolbar button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:12px;
    letter-spacing:0.06em;text-transform:uppercase;
    background:var(--teal-deep);color:#fff;border:none;padding:10px 20px;cursor:pointer;
  }
  .toolbar button:hover{background:var(--teal);}
  .cheque{
    position:relative;
    background:var(--paper);
    border:2px solid var(--teal);
    box-shadow:0 30px 60px -22px rgba(13,95,94,0.4);
    padding:28px 34px 26px;
    overflow:hidden;
  }
  .cheque::before{
    content:"";
    position:absolute;inset:8px;
    border:1px solid var(--plum);
    pointer-events:none;
  }
  .guilloche{position:absolute;inset:0;opacity:0.16;pointer-events:none;}
  .row-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    position:relative;z-index:2;
    margin-bottom:26px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border:1.5px solid var(--teal-deep);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;font-weight:700;font-size:16px;color:var(--teal-deep);
    border-radius:50%;
  }
  .brand-name{
    font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:var(--teal-deep);
    letter-spacing:0.01em;
  }
  .brand-name .sub{
    display:block;font-family:'Inter',sans-serif;font-size:9px;font-weight:600;
    letter-spacing:0.2em;text-transform:uppercase;color:var(--plum);margin-top:2px;
  }
  .num-block{text-align:right;}
  .num-block label{
    display:block;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;
  }
  .num-block input{
    font-family:'Cutive Mono',monospace;font-size:16px;color:var(--teal-deep);
    background:transparent;border:none;text-align:right;width:180px;
    border-bottom:1px solid var(--teal);
  }
  .num-block input:focus{outline:none;border-bottom-color:var(--plum);}
  .row-date{
    display:flex;justify-content:flex-end;gap:8px;align-items:baseline;
    position:relative;z-index:2;margin-bottom:20px;
  }
  .row-date label{font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
  .row-date input{
    border:none;background:transparent;border-bottom:1px solid var(--teal);
    font-family:'Cutive Mono',monospace;font-size:14px;color:var(--ink);width:130px;
  }
  .row-date input:focus{outline:none;border-bottom-color:var(--plum);}
  .pay-row{
    display:flex;align-items:baseline;gap:14px;
    position:relative;z-index:2;margin-bottom:18px;
  }
  .pay-row label{
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:15px;color:var(--teal-deep);
    white-space:nowrap;
  }
  .pay-row input{
    flex:1;border:none;background:transparent;border-bottom:1.5px solid var(--teal);
    font-family:'Cormorant Garamond',serif;font-size:19px;padding-bottom:4px;color:var(--ink);
  }
  .pay-row input:focus{outline:none;border-bottom-color:var(--plum);}
  .amt-box{
    display:flex;align-items:center;gap:8px;
    background:#fff;border:1.5px solid var(--teal);
    padding:6px 12px;flex-shrink:0;width:150px;
  }
  .amt-box span{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--teal-deep);font-size:18px;}
  .amt-box input{
    border:none;background:transparent;font-family:'Cutive Mono',monospace;
    font-size:16px;color:var(--ink);width:100%;
  }
  .amt-box input:focus{outline:none;}
  .words-row{
    display:flex;align-items:baseline;gap:14px;
    position:relative;z-index:2;margin-bottom:22px;
  }
  .words-row input{
    flex:1;border:none;background:transparent;border-bottom:1px solid var(--teal);
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;padding-bottom:4px;color:var(--ink);
  }
  .words-row input:focus{outline:none;border-bottom-color:var(--plum);}
  .words-row .suffix{
    font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--teal-deep);font-size:15px;
  }
  .memo-sign{
    display:flex;justify-content:space-between;align-items:flex-end;
    position:relative;z-index:2;margin-top:30px;gap:30px;
  }
  .memo{flex:1;}
  .memo label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;}
  .memo input{
    border:none;background:transparent;border-bottom:1px dotted var(--teal);
    font-family:'Inter',sans-serif;font-size:13px;width:100%;padding-bottom:4px;color:var(--ink);
  }
  .memo input:focus{outline:none;border-bottom-color:var(--plum);}
  .sign{flex:1;text-align:center;}
  .sign .line{border-bottom:1px solid var(--ink);height:38px;}
  .sign label{display:block;margin-top:6px;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
  .mic-line{
    margin-top:26px;padding-top:14px;border-top:1px solid var(--teal);
    font-family:'Cutive Mono',monospace;letter-spacing:0.28em;color:var(--teal-deep);
    font-size:15px;text-align:center;position:relative;z-index:2;
  }
  @media print{
    body{background:#fff;padding:0;}
    .toolbar{display:none;}
    .cheque{box-shadow:none;}
  }
  @media (max-width:600px){
    .row-top{flex-direction:column;gap:16px;}
    .num-block{text-align:left;}
    .num-block input{text-align:left;width:100%;}
    .pay-row{flex-direction:column;align-items:stretch;}
    .amt-box{width:100%;}
    .memo-sign{flex-direction:column;gap:20px;}
  }
</style>
</head>
<body>
<div class="sheet">
<div class="cheque">
    <svg class="guilloche" viewBox="0 0 920 400" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="rg" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#6a4c93"/>
          <stop offset="100%" stop-color="#0d5f5e"/>
        </radialGradient>
      </defs>
      <g fill="none" stroke="url(#rg)" stroke-width="0.7">
        <circle cx="460" cy="200" r="40"/>
        <circle cx="460" cy="200" r="70"/>
        <circle cx="460" cy="200" r="100"/>
        <circle cx="460" cy="200" r="130"/>
        <circle cx="460" cy="200" r="160"/>
        <circle cx="460" cy="200" r="190"/>
        <ellipse cx="460" cy="200" rx="220" ry="90"/>
        <ellipse cx="460" cy="200" rx="90" ry="220"/>
      </g>
    </svg>
    <div class="row-top">
      <div class="brand">
        <div class="brand-mark">{{SCHOOL_INITIAL}}</div>
        <div class="brand-name">Meridian Bank<span class="sub">Trust &amp; Savings</span></div>
      </div>
      <div class="num-block">
        <label>Cheque Number</label>
        <span class="val"></span>
      </div>
    </div>
    <div class="row-date">
      <label>Date</label>
      <span class="val">{{ISSUED_DATE}}</span>
    </div>
    <div class="pay-row">
      <label>Pay to the order of</label>
      <span class="val">{{PAYER_NAME}}</span>
      <div class="amt-box"><span>$</span><span class="val">{{TOTAL_FORMATTED}}</span></div>
    </div>
    <div class="words-row">
      <span class="val amount-words">{{AMOUNT_WORDS}}</span>
      <span class="suffix">Dollars</span>
    </div>
    <div class="memo-sign">
      <div class="memo"><label>Memo</label><span class="val">{{PURPOSE_TEXT}}</span></div>
      <div class="sign signature-slot">{{SIGNATURE_HTML}}<label>{{SIGNER_TITLE}}</label></div>
    </div>
    <div class="mic-line">⑆ 000482619 ⑆ 021000021 ⑈ 0007754310 ⑆</div>
  </div>
</div>
  {{VERIFY_FOOTER_HTML}}
  {{VOIDED_HTML}}
</body>
</html>
