<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Transcript Summary</title>
<style>
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box}html,body{margin:0}
body{background:#dde1ea;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}

:root{--ink:#1a1a24;--acc:#7a1f2b;--mute:#666b78;--line:#d8d9e0;--soft:#f6f4f4}
body{font-family:'Source Serif 4','Iowan Old Style',Georgia,serif;font-size:10pt}
.page{padding:14mm 16mm;display:flex;flex-direction:column}
.hd{text-align:center;padding-bottom:5mm;border-bottom:.3mm solid var(--ink);position:relative}.logo{width:18mm;height:18mm;object-fit:contain;margin:0 auto 2mm}.mono{display:grid;place-items:center;font-weight:700;color:var(--acc);border:.5mm solid var(--acc);border-radius:50%;font-size:15pt}
.hd h1{margin:0;font-size:19pt;letter-spacing:.3pt}.hd p{margin:1mm 0 0;font-size:8.4pt;color:var(--mute)}
.ttl{text-align:center;margin:6mm 0 4mm}.ttl h2{margin:0;font-size:14pt;letter-spacing:2pt;text-transform:uppercase;color:var(--acc)}.ttl p{margin:1mm 0 0;font-size:9pt;color:var(--mute);font-style:italic}
.info{display:grid;grid-template-columns:1fr 1fr;gap:1.8mm 10mm;margin-bottom:5mm}.info div{display:flex;justify-content:space-between;border-bottom:.3mm dotted #9a9fae;padding-bottom:.8mm;font-size:9.4pt}.info span{color:var(--mute);font-size:8.4pt}
table{width:100%;border-collapse:collapse;font-size:9.4pt}th{text-align:center;font-size:7.8pt;text-transform:uppercase;letter-spacing:.8pt;padding:2mm 1mm;border-top:.5mm solid var(--ink);border-bottom:.5mm solid var(--ink);background:var(--soft)}th.l,td.l{text-align:left;padding-left:2mm}
td{text-align:center;padding:2mm 1mm;border-bottom:.25mm solid var(--line);font-variant-numeric:tabular-nums}td.l{font-weight:600}td.l small{display:block;font-weight:400;font-size:7.2pt;color:var(--mute)}td.fail{color:#b3202e;font-weight:700}td.rm{text-align:left;font-style:italic;color:var(--mute);font-size:8.6pt}
.compact td{padding:1.1mm 1mm}.tight td{padding:.5mm 1mm;font-size:9pt}.tight td.l small{display:none}
tfoot td{border-top:.5mm solid var(--ink);border-bottom:.5mm solid var(--ink);font-weight:700}
.sum{display:grid;grid-template-columns:repeat(4,1fr);margin:5mm 0;border:.4mm solid var(--ink)}.sum div{padding:2.4mm 3mm;border-right:.25mm solid var(--line)}.sum div:last-child{border:0}.sum span{display:block;font-size:7.6pt;color:var(--mute)}.sum b{font-size:13pt}
.pr{border:.4mm solid var(--acc);padding:3mm 4mm;font-size:9.4pt;line-height:1.5}.pr b{color:var(--acc)}
.lgd{margin-top:3mm;font-size:7.8pt;color:var(--mute)}.lgd b{color:var(--ink)}
.foot{margin-top:auto;display:flex;align-items:flex-end;gap:7mm;padding-top:7mm}.seal{width:26mm;height:26mm;border:.4mm dashed #b9bcc8;border-radius:50%;display:grid;place-items:center;font-size:7pt;color:#b9bcc8;flex:none}
.sg{flex:1;text-align:center;font-size:8pt;color:var(--mute)}.sg b{display:block;color:var(--ink);font-size:9pt}.sg .ln{height:12mm;border-bottom:.3mm solid var(--ink);margin-bottom:1.2mm;display:flex;align-items:flex-end;justify-content:center}.sg img{max-height:11mm}
.gen{text-align:center;font-size:7.4pt;color:var(--mute);margin-top:3mm}

.page{position:relative;width:210mm;height:297mm;margin:8mm auto;background:#fff;overflow:hidden;box-shadow:0 2px 18px rgba(20,30,60,.2);break-after:page}
@media print{body{background:#fff}.page{margin:0;box-shadow:none}.page:last-child{break-after:auto}}
</style></head><body><div id="root"></div>
<script>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=x=>x==null||x===''?'\u2014':esc(x);
const n=(x,d=1)=>x==null||isNaN(x)?'\u2014':String(+Number(x).toFixed(d));
const fmtDate=s=>{try{const d=new Date(s);return isNaN(d)?null:d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return null}};
const letterOf=(p,lg)=>{if(p==null)return null;const r=Math.round(p),b=(lg||[]).find(b=>r>=b.min&&r<=b.max);return b?b.letter:null};
const tone=(p,lg)=>p==null?'empty':(String(letterOf(p,lg)).toUpperCase()==='F'?'fail':'pass');
const initials=s=>(s||'').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'\u2014';
const humanize=s=>s?String(s).toLowerCase().replace(/_/g,' ').replace(/^\w/,c=>c.toUpperCase()):null;
const cell=(s,k)=>(s.cells&&s.cells[k])||null;
const groupsOf=cols=>{const g=[];cols.forEach(c=>{const m=/^(SEM\d)_/.exec(c.key),k=m?m[1]:'ALL';let x=g.find(y=>y.key===k);if(!x){x={key:k,cols:[]};g.push(x)}x.cols.push(c)});return g};
const semName=k=>({SEM1:'First semester',SEM2:'Second semester'}[k]||null);
const slots=d=>{const o=d.officialSignatures||{};return[['principal','Principal'],['registrar','Registrar'],['academic','Academic head']].map(([k,l])=>({label:l,name:(o[k]||{}).name,url:(o[k]||{}).signatureUrl}))};
const sigHtml=(d,cls='sg')=>slots(d).map(s=>`<div class="${cls}"><div class="ln">${s.url?`<img src="${esc(s.url)}" alt="">`:''}</div>${s.name?`<b>${esc(s.name)}</b>`:'<b>&nbsp;</b>'}<span>${s.label}</span></div>`).join('');
const logoHtml=(sc,cls='logo')=>sc.logoUrl?`<img class="${cls}" src="${esc(sc.logoUrl)}" alt="">`:`<div class="${cls} mono">${esc(initials(sc.name))}</div>`;
const contact=sc=>[sc.address,sc.poBox&&('P.O. Box '+sc.poBox),sc.contactPhone,sc.contactEmail].filter(Boolean).map(esc).join(' \u00B7 ');
const yearOf=s=>s.yearlyAvg!=null?s.yearlyAvg:s.average;
const attendance=a=>a==null?'\u2014':n(a,0)+'%';
function fit(sheet,levels){sheet.classList.remove(...levels);for(const c of levels){if(sheet.scrollHeight<=sheet.clientHeight+1)break;sheet.classList.add(c)}}
function makeSample(kind){
  const sem=kind==='sem',lg=[{letter:'A',min:90,max:100,detail:'Excellent',gpa:4},{letter:'B',min:80,max:89,detail:'Very good',gpa:3},{letter:'C',min:75,max:79,detail:'Good',gpa:2},{letter:'D',min:70,max:74,detail:'Fair',gpa:1},{letter:'F',min:0,max:69,detail:'Failing',gpa:0}];
  const columns=sem?[['SEM1_P1','1st'],['SEM1_P2','2nd'],['SEM1_P3','3rd'],['SEM1_EX','Exam'],['SEM2_P4','4th'],['SEM2_P5','5th'],['SEM2_P6','6th'],['SEM2_EX','Exam']].map(([key,label])=>({key,label})):[['Q1','Quarter 1'],['Q2','Quarter 2'],['Q3','Quarter 3'],['Q4','Quarter 4']].map(([key,label])=>({key,label}));
  const base=[['Mathematics','MTH',88],['English Language','ENG',82],['General Science','SCI',76],['Social Studies','SOC',91],['Civics','CIV',68],['French','FRN',84],['Computer Studies','ICT',93],['Physical Education','PE',79],['Literature','LIT',72]];
  const mean=a=>{const x=a.filter(y=>y!=null);return x.length?x.reduce((p,c)=>p+c,0)/x.length:null};
  const subjects=base.map(([name,code,b],i)=>{const cells={};columns.forEach((c,j)=>{let s=Math.max(40,Math.min(100,b+((i*7+j*3)%9)-3));if(i===4&&j===(sem?7:3))s=null;cells[c.key]={score:s}});
    const g=k=>mean(columns.filter(c=>c.key.startsWith(k)).map(c=>cells[c.key].score));
    const s1=sem?g('SEM1'):null,s2=sem?g('SEM2'):null,yr=sem?mean([s1,s2]):mean(columns.map(c=>cells[c.key].score));
    return{subjectId:'s'+i,name,code,cells,sem1Avg:s1,sem2Avg:s2,yearlyAvg:sem?yr:null,average:yr,letter:letterOf(yr,lg),remark:(lg.find(x=>x.letter===letterOf(yr,lg))||{}).detail}});
  const all=subjects.map(s=>s.average),gp=mean(subjects.map(s=>(lg.find(x=>x.letter===s.letter)||{}).gpa));
  return{school:{name:'Greenfield Academy',address:'12 Tubman Boulevard, Monrovia',poBox:'1234',country:'Liberia',county:'Montserrado',district:'Greater Monrovia',contactPhone:'+231 77 000 0000',contactEmail:'office@greenfield.example'},
    student:{id:'GA-2026-0142',name:'Grace K. Johnson',sex:'Female',classLabel:'Grade 9 \u2013 A',gradeLevelLabel:'Grade 9'},academicYear:{id:'ay1',label:'2026/2027'},
    calendar:{patternType:sem?'SEMESTER':'FOUR_QUARTER'},columns,subjects,legend:lg.map(({letter,min,max,detail})=>({letter,min,max,detail})),
    aggregates:{overallAverage:mean(all),gpa:gp,classPosition:'4th of 38',attendanceRate:96},
    promotion:{outcome:'PROMOTED',toGrade:'Grade 10',conditionedSubjects:[],probationWeeks:null,remarks:'Promoted to the next grade. Keep up the consistent effort.',finalizedAt:'2027-06-24'},
    templateKey:'SAMPLE',generatedAt:new Date().toISOString(),officialSignatures:{principal:{name:'Dr. A. Kamara'},registrar:{name:'M. Dennis'},academic:{name:'S. Brown'}}};
}


function render(d,root){
 const sc=d.school||{},st=d.student||{},lg=d.legend||[],subs=d.subjects||[],ag=d.aggregates||{},pr=d.promotion,cols=d.columns||[];
 const hasSem=cols.some(c=>/^SEM\d_/.test(c.key));
 const rows=subs.map(s=>`<tr><td class="l">${esc(s.name)}${s.code?`<small>${esc(s.code)}</small>`:''}</td>${hasSem?`<td class="${tone(s.sem1Avg,lg)}">${n(s.sem1Avg)}</td><td class="${tone(s.sem2Avg,lg)}">${n(s.sem2Avg)}</td>`:''}<td class="${tone(yearOf(s),lg)}"><b>${n(yearOf(s))}</b></td><td class="${tone(yearOf(s),lg)}"><b>${v(s.letter??letterOf(yearOf(s),lg))}</b></td><td class="rm">${v(s.remark)}</td></tr>`).join('')||`<tr><td colspan="7" style="padding:12mm;color:#666b78">No released grades for this period yet.</td></tr>`;
 const prTxt=pr?`<b>Promotion status:</b> ${v(humanize(pr.outcome))}${pr.toGrade?` \u2014 to ${esc(pr.toGrade)}`:''}.${(pr.conditionedSubjects||[]).length?` Conditioned in ${pr.conditionedSubjects.map(x=>esc(x.name||x)).join(', ')}.`:''}${pr.probationWeeks?` Probation: ${esc(pr.probationWeeks)} weeks.`:''}${pr.remarks?' '+esc(pr.remarks):''}${pr.finalizedAt?` <i>Finalised ${fmtDate(pr.finalizedAt)}.</i>`:''}`:`<b>Promotion status:</b> not yet finalised.`;
 root.innerHTML=`<section class="page intl-a4-page report-card-sheet"><header class="hd">${logoHtml(sc)}<h1>${v(sc.name)}</h1><p>${esc(contact(sc))||'\u2014'}</p></header>
 <div class="ttl"><h2>Academic Transcript Summary</h2><p>Academic year ${v((d.academicYear||{}).label)}</p></div>
 <div class="info"><div><span>Learner</span><b>${v(st.name)}</b></div><div><span>Learner ID</span><b>${v(st.id)}</b></div><div><span>Class</span><b>${v(st.classLabel)}</b></div><div><span>Grade level</span><b>${v(st.gradeLevelLabel)}</b></div></div>
 <table><thead><tr><th class="l">Subject</th>${hasSem?'<th>Sem. 1</th><th>Sem. 2</th>':''}<th>Final</th><th>Grade</th><th class="l">Remark</th></tr></thead><tbody>${rows}</tbody></table>
 <div class="sum"><div><span>Overall average</span><b>${n(ag.overallAverage)}</b></div><div><span>Cumulative GPA</span><b>${n(ag.gpa,2)}</b></div><div><span>Class position</span><b>${v(ag.classPosition)}</b></div><div><span>Attendance</span><b>${attendance(ag.attendanceRate)}</b></div></div>
 <div class="pr">${prTxt}</div><div class="lgd">Grading scale: ${lg.map(b=>`<b>${esc(b.letter)}</b> ${b.min}\u2013${b.max}`).join(' \u00B7 ')}</div>
 <footer class="foot"><div class="seal">School seal</div>${sigHtml(d)}</footer><div class="gen">Issued ${v(fmtDate(d.generatedAt))}</div></section>`;
 fit(root.querySelector('.page'),['compact','tight']);
}

render(window.__REPORT_CARD_PAYLOAD__||makeSample('sem'),document.getElementById('root'));
</script></body></html>
