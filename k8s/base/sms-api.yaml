apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-api
  namespace: school-portal
  labels:
    app: sms-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sms-api
  template:
    metadata:
      labels:
        app: sms-api
    spec:
      containers:
      - name: sms-api
        image: sms-api:latest
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: school-global-config
        - secretRef:
            name: school-app-secrets
        env:
        - name: NODE_ENV
          value: production
        - name: DATABASE_PROVIDER
          value: postgresql
        - name: PORT
          value: "3000"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sms-api
  namespace: school-portal
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: sms-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sms-api-hpa
  namespace: school-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sms-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sms-api-pdb
  namespace: school-portal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sms-api
