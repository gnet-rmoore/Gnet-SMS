apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: school-portal
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        ports:
        - containerPort: 8081
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        envFrom:
        - configMapRef:
            name: school-global-config
        - secretRef:
            name: school-app-secrets
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "8081"
        - name: DISABLE_MONOLITH
          value: "true"
        - name: IDENTITY_URL
          value: http://identity-service:80
        - name: LIFECYCLE_URL
          value: http://lifecycle-service:80
        - name: OPS_URL
          value: http://ops-service:80
        - name: STAFF_URL
          value: http://staff-service:80
        - name: CLASSROOM_URL
          value: http://classroom-service:80
        - name: ACADEMIC_URL
          value: http://academic-service:80
        - name: FINANCE_URL
          value: http://finance-service:80
        - name: COMMS_URL
          value: http://comms-service:80
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: school-portal
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8081
    protocol: TCP
  selector:
    app: api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: school-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: school-portal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
