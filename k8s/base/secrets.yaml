# DO NOT commit real values; use Sealed Secrets / External Secrets / Secret Manager.
# This file documents the *shape* only — replace REPLACE_ME before applying.
#
# Database posture (recommended):
# - ONE managed Postgres with HA (Cloud SQL HA / RDS Multi-AZ / Azure Flexible Server zone-redundant).
# - Per-service LOGIN roles + schema grants (see docker/postgres/init-schemas.sql).
# - Separate Postgres instances only for a concrete Phase C need (usually Finance), not all eight.
apiVersion: v1
kind: Secret
metadata:
  name: school-app-secrets
  namespace: school-portal
type: Opaque
stringData:
  JWT_ACCESS_SECRET: "REPLACE_ME"
  SUPER_ADMIN_JWT_SECRET: "REPLACE_ME"
  SERVICE_JWT_SIGNING_KEY: "REPLACE_ME"
  INTERNAL_SERVICE_TOKEN: "REPLACE_ME"
  # Admin / emergency monolith only — full cluster access
  DATABASE_URL: "postgresql://sms:REPLACE_ME@YOUR_PG_HOST:5432/sms_db?schema=public"
  REDIS_URL: "REPLACE_ME"
---
