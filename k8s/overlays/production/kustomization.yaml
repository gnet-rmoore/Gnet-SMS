apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: school-portal

# Phase 6: sms-api retired from default deploy. Emergency: kubectl apply -f ../../base/sms-api.yaml
resources:
  - ../../base/namespace.yaml
  - ../../base/configmap.yaml
  - ../../base/secrets.yaml
  - ../../base/redis.yaml
  - ../../base/api-gateway.yaml
  - ../../base/identity-service.yaml
  - ../../base/lifecycle-service.yaml
  - ../../base/ops-service.yaml
  - ../../base/staff-service.yaml
  - ../../base/classroom-service.yaml
  - ../../base/academic-service.yaml
  - ../../base/finance-service.yaml
  - ../../base/comms-service.yaml
  - ../../base/frontend-spa.yaml
  - ../../base/ingress.yaml

images:
  - name: api-gateway
    newName: api-gateway
    newTag: latest
  - name: identity-service
    newName: identity-service
    newTag: latest
  - name: lifecycle-service
    newName: lifecycle-service
    newTag: latest
  - name: ops-service
    newName: ops-service
    newTag: latest
  - name: staff-service
    newName: staff-service
    newTag: latest
  - name: classroom-service
    newName: classroom-service
    newTag: latest
  - name: academic-service
    newName: academic-service
    newTag: latest
  - name: finance-service
    newName: finance-service
    newTag: latest
  - name: comms-service
    newName: comms-service
    newTag: latest
  - name: frontend-spa
    newName: frontend-spa
    newTag: latest
