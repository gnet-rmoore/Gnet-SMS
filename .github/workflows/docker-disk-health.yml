name: Production Disk Health Monitor

on:
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC daily
  workflow_dispatch:

jobs:
  check-production-disk:
    name: Check and reclaim disk on the Lightsail host
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify SSH secrets
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOSTNAME }}
          USER: ${{ secrets.LIGHTSAIL_SSH_USER }}
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          DIR: ${{ secrets.LIGHTSAIL_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          for v in HOST USER KEY DIR; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is empty or unset"; exit 1; }
          done

      - name: Check disk and prune safely over SSH
        env:
          DIR: ${{ secrets.LIGHTSAIL_DEPLOY_DIR }}
          HOST: ${{ secrets.LIGHTSAIL_HOSTNAME }}
          USER: ${{ secrets.LIGHTSAIL_SSH_USER }}
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$HOST" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          USER="$(printf '%s' "$USER" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          DIR="$(printf '%s' "$DIR" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem

          ssh -i ~/.ssh/lightsail.pem \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              "${USER}@${HOST}" "
                set -e
                cd '${DIR}'
                git pull --ff-only || true
                if [ ! -f scripts/cleanup-production.sh ]; then
                  echo '::error::scripts/cleanup-production.sh not found on the host - run a deploy first'
                  exit 1
                fi
                echo '=== Running production cleanup ==='
                bash scripts/cleanup-production.sh
              "
