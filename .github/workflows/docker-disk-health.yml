name: Production Disk Health Monitor

on:
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC daily
  workflow_dispatch:

jobs:
  check-production-disk:
    name: Check and reclaim disk on the Lightsail host
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify SSH secrets
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOSTNAME }}
          USER: ${{ secrets.LIGHTSAIL_SSH_USER }}
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          DIR: ${{ secrets.LIGHTSAIL_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          for v in HOST USER KEY DIR; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is empty or unset"; exit 1; }
          done

      - name: Check disk and prune safely over SSH
        env:
          DIR: ${{ secrets.LIGHTSAIL_DEPLOY_DIR }}
          HOST: ${{ secrets.LIGHTSAIL_HOSTNAME }}
          USER: ${{ secrets.LIGHTSAIL_SSH_USER }}
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$HOST" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          USER="$(printf '%s' "$USER" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          DIR="$(printf '%s' "$DIR" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem

          ssh -i ~/.ssh/lightsail.pem \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              "${USER}@${HOST}" "
                set -e
                cd '${DIR}'
                dc() { docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.hub.yml --profile edge \"\$@\"; }

                echo '=== Disk before ==='
                df -h /
                free_pct=\$(df -P / | awk 'NR==2 {gsub(\"%\", \"\", \$5); print 100 - \$5}')
                echo \"Free: \${free_pct}%\"

                if [ \"\$free_pct\" -ge 30 ]; then
                  echo 'Disk healthy (>= 30% free) - no cleanup needed'
                  exit 0
                fi

                echo 'Disk below 30% free - reclaiming space (volumes are preserved)'
                if dc ps --status running --services 2>/dev/null | grep -qx identity; then
                  dc exec -T identity sh -c 'ls -1t /app/backups/*.sql 2>/dev/null | tail -n +8 | xargs -r rm -f' || true
                fi
                docker image prune -f || true
                docker builder prune -f --filter until=168h || true

                echo '=== Disk after ==='
                df -h /
                after_pct=\$(df -P / | awk 'NR==2 {gsub(\"%\", \"\", \$5); print 100 - \$5}')
                echo \"Free after: \${after_pct}%\"
                if [ \"\$after_pct\" -lt 10 ]; then
                  echo \"::error::Production disk still only \${after_pct}% free after cleanup\"
                  exit 1
                fi
              "
