name: Nightly test coverage

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  unit-spa-http:
    name: Unit + SPA + HTTP smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          docker image prune -a --force || true
          docker builder prune -a --force || true
          docker system prune -a --volumes --force || true
          echo "Disk after cleanup:"
          df -h
      - run: npm ci
      - run: npm run inventory
      - run: npm run inventory:check
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run test:unit
      - run: npm run test:spa
      - name: Start compose stack
        run: docker compose up -d --build postgres redis identity lifecycle ops staff classroom academic finance comms api-gateway frontend-spa
      - name: Wait for gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/health/live || curl -sf -o /dev/null -w "%{http_code}" http://localhost:8081/api/auth/login; then
              exit 0
            fi
            sleep 5
          done
          echo "gateway not ready"
          docker compose ps
          exit 1
      - run: npm run test:http-smoke
        env:
          GATEWAY_URL: http://localhost:8081
      - run: npm run test:near-complete-smoke
        env:
          GATEWAY_URL: http://localhost:8081

  playwright:
    name: Playwright persona smoke
    runs-on: ubuntu-latest
    needs: unit-spa-http
    env:
      # Test-only secrets: shared/src/middleware/auth.ts throws at import when
      # NODE_ENV=production and these are unset, which would crash every service.
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-not-for-production
      SUPER_ADMIN_JWT_SECRET: ci-test-super-admin-jwt-secret-not-for-production
      INTERNAL_SERVICE_TOKEN: ci-test-internal-service-token
      # Seed the demo school + persona users the login-based specs use.
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          docker image prune -a --force || true
          docker builder prune -a --force || true
          docker system prune -a --volumes --force || true
          echo "Disk after cleanup:"
          df -h
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Start full stack + SPA
        run: docker compose up -d --build
      - name: Wait for SPA
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/ >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Wait for auth API + demo seed
        run: |
          # Log in as a demo persona: a 200 proves Identity is up, JWT secrets are
          # present, and SEED_DEMO populated the school + users the specs need.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' \
              --data '{"email":"schooladmin@yoursms.com","password":"admin123"}' \
              http://localhost:8081/api/auth/login || true)
            echo "attempt $i: schooladmin login -> ${code:-000}"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Auth/demo seed never became ready; dumping service state"
          docker compose ps
          docker compose logs --no-color --tail=200 identity api-gateway || true
          exit 1
      - run: npm run test:e2e
        env:
          E2E_ENABLED: "1"
          CI: nightly
          E2E_BASE_URL: http://localhost:8080
      - run: npx playwright test e2e/i18n-locale.spec.ts
        env:
          E2E_ENABLED: "1"
          CI: nightly
          E2E_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
