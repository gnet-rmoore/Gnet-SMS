name: Nightly test coverage

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  unit-spa-http:
    name: Unit + SPA + HTTP smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run inventory
      - run: npm run inventory:check
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run test:unit
      - run: npm run test:spa
      - name: Start compose stack
        run: docker compose up -d --build db redis identity lifecycle ops staff classroom academic finance comms api-gateway frontend-spa
      - name: Wait for gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/health/live || curl -sf -o /dev/null -w "%{http_code}" http://localhost:8081/api/auth/login; then
              exit 0
            fi
            sleep 5
          done
          echo "gateway not ready"
          docker compose ps
          exit 1
      - run: npm run test:http-smoke
        env:
          GATEWAY_URL: http://localhost:8081
      - run: npm run test:near-complete-smoke
        env:
          GATEWAY_URL: http://localhost:8081

  playwright:
    name: Playwright persona smoke
    runs-on: ubuntu-latest
    needs: unit-spa-http
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Start full stack + SPA
        run: docker compose up -d --build
      - name: Wait for SPA
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/ >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - run: npm run test:e2e
        env:
          E2E_ENABLED: "1"
          CI: nightly
          E2E_BASE_URL: http://localhost:8080
      - run: npx playwright test e2e/i18n-locale.spec.ts
        env:
          E2E_ENABLED: "1"
          CI: nightly
          E2E_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
