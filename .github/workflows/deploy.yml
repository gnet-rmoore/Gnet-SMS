name: Deploy GNET SMS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push service images
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          HUB="${{ secrets.DOCKERHUB_USERNAME }}"
          # folder:image pairs (image name differs from folder for the gateway)
          for pair in \
              identity:identity lifecycle:lifecycle ops:ops staff:staff \
              classroom:classroom academic:academic finance:finance comms:comms \
              campus:campus gateway:api-gateway; do
            dir="${pair%%:*}"
            name="${pair##*:}"
            image="$HUB/gnet-sms-${name}:${TAG}"
            docker build -t "$image" -f "services/${dir}/Dockerfile" "services/${dir}"
            docker push "$image"
            docker tag "$image" "$HUB/gnet-sms-${name}:latest"
            docker push "$HUB/gnet-sms-${name}:latest"
          done

      - name: Build and push frontend image
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          HUB="${{ secrets.DOCKERHUB_USERNAME }}"
          image="$HUB/gnet-sms-frontend-spa:${TAG}"
          docker build -t "$image" -f Dockerfile.frontend .
          docker push "$image"
          docker tag "$image" "$HUB/gnet-sms-frontend-spa:latest"
          docker push "$HUB/gnet-sms-frontend-spa:latest"

      - name: Deploy on Lightsail
        env:
          DIR: ${{ secrets.LIGHTSAIL_DEPLOY_DIR }}
          HOST: ${{ secrets.LIGHTSAIL_HOSTNAME }}
          USER: ${{ secrets.LIGHTSAIL_SSH_USER }}
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail
          for v in HOST USER KEY DIR; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is empty or unset (check Settings -> Secrets and variables -> Actions)"; exit 1; }
          done
          # Normalize single-line secrets: strip stray CR/LF/newlines and surrounding whitespace
          HOST="$(printf '%s' "$HOST" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          USER="$(printf '%s' "$USER" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          DIR="$(printf '%s' "$DIR" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          echo "Deploying to ${USER}@${HOST}:${DIR} (key ${#KEY} bytes, dir ${#DIR} bytes)"
          ssh -i ~/.ssh/lightsail.pem \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              "${USER}@${HOST}" "
                set -e
                cd '${DIR}'
                dc() { docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.hub.yml --profile edge \"\$@\"; }
                git pull --ff-only
                dc pull
                if ! dc up -d; then
                  echo '=== compose ps ==='
                  dc ps -a || true
                  echo '=== compose logs (tail 300) ==='
                  dc logs --no-color --tail=300 || true
                  echo '=== academic inspect ==='
                  docker inspect --format '{{json .State}}' gnet-sms-academic-1 || true
                  exit 1
                fi
              "

      - name: Health check
        env:
          # Canonical public URL. Override with a repo variable `PUBLIC_URL`.
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://gnetsms.com' }}
        run: |
          set -euo pipefail
          echo "Checking ${PUBLIC_URL} over HTTPS (valid cert + HTTP 200) ..."
          code=""
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${PUBLIC_URL}" || true)"
            if [ "$code" = "200" ]; then
              echo "OK  ${PUBLIC_URL} -> HTTP ${code}"
              exit 0
            fi
            echo "attempt ${attempt}/12: ${PUBLIC_URL} -> HTTP ${code:-none}; retrying in 5s"
            sleep 5
          done
          echo "::error::${PUBLIC_URL} did not return HTTP 200 over HTTPS (last: ${code:-none}). Check DNS, Caddy TLS issuance, and that the port-80 ACME challenge is reachable."
          exit 1