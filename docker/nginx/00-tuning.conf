# Mounted by docker-compose.prod.yml. Do not rename (must load before default.conf).
# H5: default is 1m — bulk student/staff imports were 413'd at the edge.
client_max_body_size 20m;

# L7: identity runs Prisma db push at boot (~40 s); default 60 s proxy timeout is tight.
proxy_read_timeout 180s;
proxy_send_timeout 180s;
