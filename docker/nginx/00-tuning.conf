# Mounted by docker-compose.prod.yml. Do not rename (must load before default.conf).
# H5: default is 1m — bulk student/staff imports were 413'd at the edge.
client_max_body_size 20m;

# L7: identity runs Prisma db push at boot (~40 s); bulk imports process many rows.
proxy_read_timeout 300s;
proxy_send_timeout 300s;
