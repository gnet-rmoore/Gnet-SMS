server {
    listen 80;
    # Accept platform + school custom domains (CNAME to this edge).
    # Host → school mapping is done in-app via /api/public/resolve-host.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — resolve service names at request time so that
    # api-gateway/classroom IP changes (e.g. compose restart) never go stale.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Never serve SPA HTML for API — return JSON if the gateway is unreachable.
    location /api/ {
        set $api_gateway_upstream api-gateway:8081;
        proxy_pass http://$api_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_upstream_down;
    }

    location @api_upstream_down {
        default_type application/json;
        return 503 '{"error":"API gateway unavailable"}';
    }

    # Phase 6: Socket.IO owned by Classroom service (Redis adapter for multi-replica)
    location /socket.io/ {
        set $classroom_upstream classroom:3014;
        proxy_pass http://$classroom_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Live exam proctoring socket — owned by Academic service.
    location /exam-socket/ {
        set $academic_upstream academic:3015;
        proxy_pass http://$academic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Hashed Vite build output — never SPA-fallback; plain 404 body (not HTML).
    location /assets/ {
        try_files $uri @static_missing;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sw.js {
        default_type application/javascript;
        return 404 "/* no service worker */\n";
    }

    location @static_missing {
        default_type text/plain;
        return 404 "Not Found\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
